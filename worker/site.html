<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sim Companies - Jon's City</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: radial-gradient(120% 120% at 50% 30%, #17242a 0%, #0d1518 55%, #06090a 100%);
         font-family: 'Roboto Condensed', 'Segoe UI', sans-serif; overflow: hidden; }

  /* live HUD pills */
  .pill { position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
          font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8);
          display: inline-flex; align-items: center; justify-content: center; gap: 4px; pointer-events: none;
          font-size: 15px; z-index: 10; }
  .shop { background: rgba(20,24,28,.75); border-radius: 3px; padding: 2px 10px;
          text-transform: uppercase; display: inline-flex; flex-direction: column; align-items: center; line-height: 1.3; }
  .shop .sub { font-size: .8em; opacity: .85; }
  .pulse { animation: pulse 2.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }

  /* top bar */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; justify-content: flex-end;
            align-items: flex-start; padding: 6px 10px; pointer-events: none; }
  .topbar .right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .cashbar { background: linear-gradient(#8fd231, #6cab21); border-radius: 4px; padding: 3px 40px; }
  .row2 { display: flex; gap: 4px; }
  .blue { background: linear-gradient(#79b8e0, #4d94c4); border-radius: 4px; padding: 3px 22px 3px 14px; }
  .dark { background: rgba(28,34,40,.92); border-radius: 4px; padding: 3px 12px; }

  /* bottom nav */
  .navbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; height: 46px;
            background: rgba(12,15,17,.92); border-top: 1px solid rgba(255,255,255,.06);
            display: flex; justify-content: center; gap: 7vw; align-items: center;
            color: #e6eef2; font-size: 16px; }
  .navbar span { display: inline-flex; gap: 8px; align-items: center; opacity: .95; }

  .toggle { position: fixed; left: 10px; top: 10px; z-index: 50; background: rgba(20,24,28,.85);
            color: #cfe3ea; border: 1px solid #2a353a; border-radius: 6px; padding: 6px 12px; cursor: pointer;
            font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .05em; }
  .toggle:hover { background: rgba(40,50,58,.9); }

  .panel { position: fixed; z-index: 40; left: 10px; top: 46px; width: 380px; max-width: calc(100vw - 20px);
           max-height: calc(100vh - 60px); overflow: auto; display: none;
           background: rgba(13,17,20,.97); border: 1px solid #2a353a; border-radius: 10px; padding: 14px 16px; color: #dfe7ea; }
  .panel.open { display: block; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #9fb4bd; margin: 12px 0 8px; }
  .panel h2:first-child { margin-top: 0; }
  .panel .stat { font-size: 14px; line-height: 1.5; }
  .panel .muted { color: #68808c; font-size: 12px; margin-top: 4px; }
  .panel ol.plan { padding-left: 18px; }
  .panel ol.plan li { margin: 4px 0; font-size: 13px; color: #b8c7cf; }
  .panel ul.log { list-style: none; padding: 0; max-height: 220px; overflow: auto; }
  .panel ul.log li { padding: 4px 0; border-bottom: 1px solid #232d31; font-size: 12.5px; color: #b8c7cf; }
  .panel ul.log time { color: #68808c; margin-right: 6px; }
  .panel .row { display: flex; gap: 8px; margin-top: 8px; }
  .panel input[type=text] { flex: 1; background: #1d2629; color: #dfe7ea; border: 1px solid #2a353a; border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .panel button.go { background: #2b6f43; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-family: inherit; }
  .panel button.go:hover { background: #338654; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button { background: #24435a; color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-family: inherit; font-size: 12px; }
  .quick button:hover { background: #2f5a77; }
  .cmdline { font-size: 12px; color: #8aa0aa; margin-top: 6px; }
</style>
</head>
<body>
<button class="toggle" id="toggle">CONSOLE</button>
<div class="panel" id="panel">
  <h2>Now</h2>
  <div class="stat" id="now">loading…</div>
  <div class="muted" id="next"></div>
  <h2>Plan</h2>
  <ol class="plan" id="plan"></ol>
  <h2>Steer</h2>
  <div class="quick">
    <button data-c="status">Report status</button>
    <button data-c="dump apples on exchange at best bid">Dump apples on exchange</button>
    <button data-c="raise store price">Raise store prices</button>
    <button data-c="buy lots of water">Buy water</button>
    <button data-c="pause">Hold / pause</button>
    <button data-c="resume">Resume</button>
  </div>
  <div class="row">
    <input id="cmd" type="text" placeholder="Type a command, then Enter" />
    <button class="go" id="send">Send</button>
  </div>
  <div class="cmdline" id="cmdlog"></div>
  <h2>What Jon's agent did</h2>
  <ul class="log" id="log"></ul>
</div>

<div class="topbar"><div class="right">
  <div class="cashbar" id="t-cash">$0</div>
  <div class="row2"><div class="blue" id="t-credits">&#9733; 0</div><div class="dark" id="t-level">Lv. 0</div></div>
</div></div>

<div class="navbar">
  <span>&#128506; Map</span><span>&#128230; Warehouse</span><span>&#128269; Search</span><span>&#128172; Chat</span><span>&#8646; Exchange</span>
</div>

<div id="world" style="position:absolute; transform-origin: 0 0;"></div>

<script>
  // ---------- isometric world built from SimCompanies' own sprites (spring season) ----------
  const CELLX = 219, CELLY = 110;      // measured: diamond width 437 -> step 219, height ~300 -> step 110
  const OFFY = 430;                    // world y offset for tall buildings
  const worldW = 3140, worldH = 1700;

  // grid[r][c]: 'road' = street grid; else block kind  (7 cols x 5 rows, roads at odd indices)
  const G = [
    ['resA', 'road', 'farm',   'road', 'resB',   'road', 'pines'],
    ['road', 'road', 'road',   'road', 'road',   'road', 'road'],
    ['store', 'road', 'park',  'road', 'exchange', 'road', 'hq'],
    ['road', 'road', 'road',   'road', 'road',   'road', 'road'],
    ['res21', 'road', 'constr1', 'road', 'constr2', 'road', 'pines2'],
  ];
  const R = 5, C = 7;
  const ITEMS = {
    resA: ['decor-residential4.png'], resB: ['decor-residential31.png'], res21: ['decor-residential21.png'],
    park: ['decor-park.png'],
    farm: ['building-farm-lvl1.png'], store: ['building-grocery2-lvl1.png'],
    exchange: ['c-grocery-idle-t1.png'], hq: ['decor-plaza.png', 'building-money.png'],
    constr1: ['building-construction_slot_01.png'], constr2: ['building-construction_slot_02.png'],
  };
  const VIDEO = [];
  // trucks parked on streets
  const PROPS = [ ['decor-truck.png', 1, 2], ['decor-truck2.png', 3, 4] ];

  function cellXY(c, r) { return { x: (c - r) * CELLX + worldW / 2, y: (c + r) * CELLY + OFFY }; }

  const world = document.getElementById('world');
  world.style.width = worldW + 'px';
  world.style.height = worldH + 'px';

  function fit() {
    const s = window.innerWidth / worldW;
    world.style.transform = 'scale(' + s + ')';
    world.style.left = '0px';
    world.style.top = Math.max(0, (window.innerHeight - worldH * s) / 2 - 20) + 'px';
  }
  window.addEventListener('resize', fit);

  let OFF = {};
  const CX = (o) => (o.x0 + o.x1) / 2;
  function img(src, x, y, anchor, z, extraCss) {
    const o = OFF[src];
    const cx = o ? CX(o) : 256;
    const el = VIDEO.includes(src) ? document.createElement('video') : document.createElement('img');
    if (el.tagName === 'VIDEO') {
      el.src = src; el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true; el.style.width = '512px'; el.style.height = '512px';
    } else {
      el.src = src;
    }
    el.style.position = 'absolute';
    el.style.zIndex = z;
    if (extraCss) el.style.cssText += extraCss;
    if (anchor === 'bottom') {
      const y1 = o ? o.y1 : 460;
      el.style.left = (x - cx) + 'px';
      el.style.top = (y - y1) + 'px';
    } else {
      // ground: anchor the top diamond's center (bbox includes the front skirt)
      const cy = o ? o.y0 + (o.y1 - o.y0) * 0.36 : 256;
      el.style.left = (x - cx) + 'px';
      el.style.top = (y - cy) + 'px';
    }
    world.appendChild(el);
  }

  function build() {
    // ground + roads sorted back-to-front so front skirts overlap rear ones
    const ground = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const p = cellXY(c, r);
      if (G[r][c] === 'road') {
        if (r % 2 === 1 && c % 2 === 1) {
          // crossing: the intersection sprite is a placeholder, so superimpose the two strips
          ground.push({ s: 'sroad-00.png', x: p.x, y: p.y, z: 1 + c + r });
          ground.push({ s: 'sroad-left-00.png', x: p.x, y: p.y, z: 2 + c + r });
        } else if (r % 2 === 1) {
          ground.push({ s: c === 0 ? 'sroad-10.png' : c === C - 1 ? 'sroad-01.png' : 'sroad-00.png', x: p.x, y: p.y, z: 1 + c + r });
        } else {
          ground.push({ s: r === 0 ? 'sroad-left-01.png' : r === R - 1 ? 'sroad-left-10.png' : 'sroad-left-00.png', x: p.x, y: p.y, z: 1 + c + r });
        }
      } else if (G[r][c] === 'pines' || G[r][c] === 'pines2') {
        // for-sale pine parcel (the UNLOCKable land look)
        ground.push({ s: 'decor-empty2.png', x: p.x, y: p.y, z: 1 + c + r });
      } else {
        // grass block with sidewalk ring (the real map's block base)
        ground.push({ s: 'base-1111.png', x: p.x, y: p.y, z: 1 + c + r });
      }
    }
    for (const g of ground) img(g.s, g.x, g.y, 'ground', g.z);
    const items = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const list = ITEMS[G[r][c]];
      if (list) for (const s of list) items.push({ s, c, r });
    }
    for (const [s, c, r, above] of PROPS) items.push({ s, c, r, prop: true, above });
    items.sort((a, b) => (a.c + a.r) - (b.c + b.r));
    for (const it of items) {
      const p = cellXY(it.c, it.r);
      img(it.s, p.x + (it.above ? 60 : 0), p.y + (it.above ? -60 : 52), 'bottom', it.above ? 40 : 20 + it.c + it.r);
    }
  }

  function pill(o) {
    const d = document.createElement('div');
    d.className = 'pill ' + (o.kind || 'shop') + (o.pulse ? ' pulse' : '');
    const p = cellXY(o.c, o.r);
    d.style.left = ((p.x / worldW) * 100) + '%';
    d.style.top = (((p.y + (o.dy || 0)) / worldH) * 100) + '%';
    if (o.css) d.style.cssText += ';' + o.css;
    d.innerHTML = o.html;
    world.appendChild(d);
  }

  async function load() {
    try {
      const s = await fetch('/api/state').then(r => r.json());
      if (s.top) {
        document.getElementById('t-cash').textContent = s.top.cash || '$0';
        document.getElementById('t-credits').innerHTML = '&#9733; ' + (s.top.credits || '0');
        document.getElementById('t-level').textContent = s.top.level || 'Lv. 0';
      }
      world.querySelectorAll('.pill').forEach(e => e.remove());
      for (const o of s.overlay || []) pill(o);
      document.getElementById('now').innerHTML = s.now || '';
      document.getElementById('next').textContent = s.next ? ('Next move: ' + s.next) : '';
      document.getElementById('plan').innerHTML = (s.plan || []).map(p => '<li>' + p + '</li>').join('');
      const log = await fetch('/api/log').then(r => r.text());
      const entries = log.split('\n').filter(Boolean).reverse().slice(0, 40);
      document.getElementById('log').innerHTML = entries.map(e => '<li>' + e + '</li>').join('');
      const cl = await fetch('/api/cmdlog').then(r => r.json()).catch(() => []);
      document.getElementById('cmdlog').textContent = cl.length ? ('last command: ' + cl[cl.length - 1].text + ' (' + cl[cl.length - 1].status + ')') : '';
    } catch (e) { document.getElementById('now').textContent = 'server unreachable'; }
  }

  (async () => {
    OFF = await fetch('/offsets.json').then(r => r.json());
    build();
    fit();
    load();
  })();
  setInterval(load, 5000);

  document.getElementById('toggle').addEventListener('click', () => document.getElementById('panel').classList.toggle('open'));
  function send(text) {
    if (!text || !text.trim()) return;
    fetch('/api/command', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) }).then(load);
  }
  document.querySelectorAll('.quick button').forEach(b => b.addEventListener('click', () => send(b.dataset.c)));
  document.getElementById('send').addEventListener('click', () => { send(document.getElementById('cmd').value); document.getElementById('cmd').value = ''; });
  document.getElementById('cmd').addEventListener('keydown', e => { if (e.key === 'Enter') { send(document.getElementById('cmd').value); document.getElementById('cmd').value = ''; } });
</script>
</body>
</html>
